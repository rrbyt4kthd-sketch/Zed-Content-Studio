
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA — AI Content Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:#f5f6ff;font-family:Arial,sans-serif}
header{padding:22px 6%;border-bottom:1px solid #283044;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:bold;letter-spacing:3px}
.logo span{color:#718cff}
select,input,textarea{width:100%;padding:15px;margin:8px 0 17px;background:#111a2b;border:1px solid #39445c;border-radius:10px;color:white;font-size:16px}
main{max-width:750px;margin:55px auto;padding:20px}
h1{font-size:36px;text-align:center}
.sub{text-align:center;color:#aab2c5;line-height:1.8;margin-bottom:35px}
.card{background:#101a2b;border:1px solid #303b53;padding:25px;border-radius:18px}
label{font-weight:bold}
button{background:#718cff;color:white;border:0;padding:16px;border-radius:11px;font-size:17px;font-weight:bold;width:100%;cursor:pointer;margin-top:10px}
button.secondary{background:#26334e}
#result{display:none;white-space:pre-wrap;line-height:1.9;background:#080d19;padding:20px;border-radius:12px;margin-top:20px;overflow-wrap:anywhere}
footer{text-align:center;color:#8993a9;padding:35px}
</style>
</head>
<body>
<header>
<div class="logo">NEXORA<span>.</span></div>
<select id="lang" style="width:115px;margin:0" onchange="changeLang()">
<option value="ar">العربية</option>
<option value="fr">Français</option>
<option value="en">English</option>
</select>
</header>

<main>
<h1 id="title">اصنع إعلانك الاحترافي</h1>
<p class="sub" id="desc">حوّل منتجاتك إلى إعلانات جذابة تساعدك على زيادة المبيعات.</p>

<div class="card">
<label id="l1">اسم المنتج</label>
<input id="product" placeholder="مثال: كريم العناية بالبشرة">

<label id="l2">السعر</label>
<input id="price" placeholder="مثال: 39 دينار">

<label id="l3">مميزات المنتج</label>
<textarea id="features" rows="3" placeholder="اكتب أهم مميزات منتجك"></textarea>

<label id="l4">الجمهور المستهدف</label>
<input id="audience" placeholder="مثال: النساء من 20 إلى 40 سنة">

<label id="l5">منصة الإعلان</label>
<select id="platform">
<option>Facebook</option>
<option>Instagram</option>
<option>TikTok</option>
</select>

<label id="l6">أسلوب الإعلان</label>
<select id="style">
<option value="strong">إقناعي وتسويقي</option>
<option value="friendly">ودّي وبسيط</option>
<option value="premium">فاخر واحترافي</option>
</select>

<button onclick="generate()" id="generate">✨ أنشئ الإعلان</button>

<div id="result"></div>
<button class="secondary" id="copy" onclick="copyText()" style="display:none">نسخ الإعلان</button>
</div>
</main>

<footer>© 2026 NEXORA CONTENT STUDIO</footer>

<script>
const translations={
ar:["اصنع إعلانك الاحترافي","حوّل منتجاتك إلى إعلانات جذابة تساعدك على زيادة المبيعات.","اسم المنتج","السعر","مميزات المنتج","الجمهور المستهدف","منصة الإعلان","أسلوب الإعلان","✨ أنشئ الإعلان","نسخ الإعلان","اكتب اسم المنتج ومميزاته أولاً","اكتشفوا {p}! ✨\n\n{f}\n\nاطلبوه الآن بسعر {price}.\n\nلا تفوّتوا الفرصة! 🔥\n\n#تسوق #منتجات"],
fr:["Créez votre publicité","Transformez vos produits en publicités attractives.","Nom du produit","Prix","Avantages du produit","Public cible","Plateforme","Style publicitaire","✨ Créer la publicité","Copier la publicité","Entrez le nom et les avantages du produit","Découvrez {p} ! ✨\n\n{f}\n\nCommandez maintenant au prix de {price}.\n\nNe manquez pas cette occasion ! 🔥"],
en:["Create your professional ad","Turn your products into attractive marketing content.","Product name","Price","Product benefits","Target audience","Ad platform","Ad style","✨ Generate Ad","Copy Ad","Enter the product name and benefits first","Discover {p}! ✨\n\n{f}\n\nOrder now for {price}.\n\nDon't miss this opportunity! 🔥"]
};
function changeLang(){
let l=document.getElementById("lang").value,t=translations[l];
document.documentElement.lang=l;
document.documentElement.dir=l==="ar"?"rtl":"ltr";
["title","desc","l1","l2","l3","l4","l5","l6","generate","copy"].forEach((id,i)=>document.getElementById(id).textContent=t[i]);
}
function generate(){
let l=document.getElementById("lang").value,t=translations[l];
let p=document.getElementById("product").value.trim();
let price=document.getElementById("price").value.trim();
let f=document.getElementById("features").value.trim();
let audience=document.getElementById("audience").value.trim();
if(!p||!f){alert(t[10]);return;}
let style=document.getElementById("style").value;
let intro=style==="premium"?"Découvrez l'excellence de":style==="friendly"?"On vous présente":"Ne manquez pas";
let result=t[11].replace("{p}",p).replace("{f}",f).replace("{price}",price||"prix sur demande");
if(l==="fr")result=result.replace("Découvrez "+p+" !",""+intro+" "+p+" !");
if(l==="en")result=result.replace("Discover "+p+"!","Introducing "+p+"!");
if(l==="ar"){
result="✨ اكتشفوا "+p+"!\n\n"+f+"\n\n"+(audience?"موجّه إلى: "+audience+"\n\n":"")+"اطلبوه الآن "+(price?"بسعر "+price:"بسعر مميز")+".\n\nراسلونا للطلب والاستفسار 🔥";
}
document.getElementById("result").textContent=result+"\n\n"+document.getElementById("platform").value;
document.getElementById("result").style.display="block";
document.getElementById("copy").style.display="block";
}
function copyText(){
navigator.clipboard.writeText(document.getElementById("result").textContent).then(()=>alert("Copied!"));
}
</script>
</body>
</html>
