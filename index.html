
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>NEXORA — AI Marketing Studio</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:#f5f6ff;
 font-family:Arial,sans-serif;line-height:1.7
}
header{
 padding:20px 6%;border-bottom:1px solid #283044;
 display:flex;justify-content:space-between;align-items:center;
 gap:15px
}
.logo{font-size:27px;font-weight:bold;letter-spacing:3px}
.logo span{color:#718cff}
select,input,textarea{
 width:100%;padding:14px;margin:8px 0 17px;
 background:#111a2b;border:1px solid #39445c;
 border-radius:10px;color:white;font-size:16px
}
main{max-width:850px;margin:35px auto;padding:18px}
h1{text-align:center;font-size:32px}
.sub{text-align:center;color:#aab2c5;margin-bottom:30px}
.card{
 background:#101a2b;border:1px solid #303b53;
 padding:24px;border-radius:18px;margin-bottom:20px
}
label{font-weight:bold;display:block}
.platforms{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
 margin:12px 0 22px
}
.platform{
 background:#17243a;border:1px solid #39445c;
 border-radius:12px;padding:13px;text-align:center;
 cursor:pointer
}
.platform input{width:auto;margin:0 5px 0 0}
button{
 background:#718cff;color:white;border:0;padding:15px;
 border-radius:11px;font-size:16px;font-weight:bold;
 width:100%;cursor:pointer;margin-top:10px
}
button.secondary{background:#26334e}
.result-card{
 background:#080d19;border:1px solid #39445c;
 padding:18px;border-radius:12px;margin-top:15px
}
.result-card h3{color:#91a6ff;margin-top:0}
.result-text{white-space:pre-wrap;overflow-wrap:anywhere}
.small-btn{padding:10px;font-size:14px}
footer{text-align:center;color:#8993a9;padding:30px}
.hidden{display:none}
@media(max-width:500px){
 h1{font-size:26px}
 .platforms{grid-template-columns:1fr}
 header{padding:15px}
}
</style>
</head>

<body>

<header>
 <div class="logo">NEXORA<span>.</span></div>
 <select id="lang" style="width:125px;margin:0"
 onchange="changeLang()">
  <option value="ar">العربية</option>
  <option value="fr">Français</option>
  <option value="en">English</option>
 </select>
</header>

<main>

<h1 id="title">NEXORA Marketing Studio</h1>
<p class="sub" id="desc">
أنشئ محتوى تسويقي احترافي لمنتجاتك في ثوانٍ.
</p>

<div class="card">

<label id="l1">اسم المنتج أو العلامة التجارية</label>
<input id="product" placeholder="مثال: Talbina">

<label id="l2">السعر</label>
<input id="price" placeholder="مثال: 39 DT">

<label id="l3">مميزات المنتج</label>
<textarea id="features" rows="4"
placeholder="اكتب مميزات المنتج الحقيقية"></textarea>

<label id="l4">الجمهور المستهدف</label>
<input id="audience" placeholder="مثال: المهتمون بالتغذية اليومية">

<label id="l5">المنصات الإعلانية (يمكن اختيار أكثر من واحدة)</label>

<div class="platforms">
 <label class="platform">
  <input type="checkbox" name="platform" value="Facebook">
  Facebook
 </label>

 <label class="platform">
  <input type="checkbox" name="platform" value="Instagram">
  Instagram
 </label>

 <label class="platform">
  <input type="checkbox" name="platform" value="TikTok">
  TikTok
 </label>
</div>

<label id="l6">أسلوب الإعلان</label>
<select id="style">
 <option value="strong">إقناعي وتسويقي</option>
 <option value="friendly">ودّي وبسيط</option>
 <option value="premium">فاخر واحترافي</option>
</select>

<label id="l7">نوع المحتوى</label>
<select id="contentType">
 <option value="sales">إعلان لزيادة المبيعات</option>
 <option value="awareness">التعريف بالمنتج</option>
 <option value="video">سكريبت فيديو Reels / TikTok</option>
 <option value="launch">إطلاق منتج جديد</option>
</select>

<button onclick="generate()" id="generate">
✨ أنشئ المحتوى التسويقي
</button>

<div id="results"></div>

<button class="secondary hidden" id="copyAll"
onclick="copyAll()">نسخ جميع النتائج</button>

</div>
</main>

<footer>© 2026 NEXORA CONTENT STUDIO</footer>

<script>

const translations={
ar:{
title:"NEXORA Marketing Studio",
desc:"أنشئ محتوى تسويقي احترافي لمنتجاتك في ثوانٍ.",
labels:["اسم المنتج أو العلامة التجارية","السعر",
"مميزات المنتج","الجمهور المستهدف","المنصات الإعلانية",
"أسلوب الإعلان","نوع المحتوى"],
generate:"✨ أنشئ المحتوى التسويقي",
copy:"نسخ",
copyAll:"نسخ جميع النتائج",
error:"يرجى إدخال اسم المنتج ومميزاته واختيار منصة واحدة على الأقل.",
price:"السعر عند الطلب",
hook:"🔥 هل تبحث عن منتج يستحق التجربة؟",
intro:"اكتشفوا",
cta:"راسلونا الآن للاستفسار والطلب.",
script:"سكريبت الفيديو",
caption:"الكابشن الإعلاني",
hashtags:"الهاشتاغات",
audience:"الجمهور المستهدف"
},
fr:{
title:"NEXORA Marketing Studio",
desc:"Créez du contenu marketing professionnel en quelques secondes.",
labels:["Nom du produit ou marque","Prix","Avantages du produit",
"Public cible","Plateformes publicitaires","Style publicitaire","Type de contenu"],
generate:"✨ Générer le contenu",
copy:"Copier",
copyAll:"Tout copier",
error:"Veuillez saisir le produit, ses avantages et choisir une plateforme.",
price:"Prix sur demande",
hook:"🔥 Découvrez un produit qui mérite votre attention !",
intro:"Découvrez",
cta:"Contactez-nous pour commander.",
script:"Script vidéo",
caption:"Légende publicitaire",
hashtags:"Hashtags",
audience:"Public cible"
},
en:{
title:"NEXORA Marketing Studio",
desc:"Create professional marketing content in seconds.",
labels:["Product or brand name","Price","Product benefits",
"Target audience","Advertising platforms","Ad style","Content type"],
generate:"✨ Generate content",
copy:"Copy",
copyAll:"Copy all results",
error:"Enter the product, its benefits and select at least one platform.",
price:"Price on request",
hook:"🔥 Discover a product worth exploring!",
intro:"Discover",
cta:"Contact us to order.",
script:"Video script",
caption:"Advertising caption",
hashtags:"Hashtags",
audience:"Target audience"
}
};

function changeLang(){
 const l=document.getElementById("lang").value;
 const t=translations[l];
 document.documentElement.lang=l;
 document.documentElement.dir=l==="ar"?"rtl":"ltr";
 document.getElementById("title").textContent=t.title;
 document.getElementById("desc").textContent=t.desc;

 ["l1","l2","l3","l4","l5","l6","l7"].forEach((id,i)=>{
  document.getElementById(id).textContent=t.labels[i];
 });

 document.getElementById("generate").textContent=t.generate;
 document.getElementById("copyAll").textContent=t.copyAll;
}

function generate(){

 const l=document.getElementById("lang").value;
 const t=translations[l];

 const p=document.getElementById("product").value.trim();
 const price=document.getElementById("price").value.trim();
 const f=document.getElementById("features").value.trim();
 const audience=document.getElementById("audience").value.trim();

 const platforms=[...document.querySelectorAll(
 'input[name="platform"]:checked'
 )].map(x=>x.value);

 if(!p||!f||platforms.length===0){
  alert(t.error);
  return;
 }

 const style=document.getElementById("style").value;
 const type=document.getElementById("contentType").value;
 const results=document.getElementById("results");

 results.innerHTML="";

 platforms.forEach(platform=>{

  let hook=t.hook;

  if(l==="ar"){
   if(style==="premium") hook="✨ اكتشفوا تجربة مميزة مع "+p;
   if(style==="friendly") hook="شنوة رأيكم تكتشفوا "+p+"؟";
   if(style==="strong") hook="🔥 "+p+" يستحق اهتمامكم!";
  }

  let caption="";

  if(l==="ar"){
   caption=hook+"\n\n"+t.intro+" "+p+"!\n\n"+
   f+"\n\n"+
   (audience?"موجّه إلى: "+audience+"\n\n":"")+
   (price?"السعر: "+price+"\n\n":"")+
   t.cta;
  }

  if(l==="fr"){
   caption=hook+"\n\n"+t.intro+" "+p+" !\n\n"+
   f+"\n\n"+
   (audience?"Public cible : "+audience+"\n\n":"")+
   (price?"Prix : "+price+"\n\n":"")+
   t.cta;
  }

  if(l==="en"){
   caption=hook+"\n\n"+t.intro+" "+p+"!\n\n"+
   f+"\n\n"+
   (audience?"Target audience: "+audience+"\n\n":"")+
   (price?"Price: "+price+"\n\n":"")+
   t.cta;
  }

  let script="";

  if(l==="ar"){
   script="🎬 المشهد الأول – Hook\n"+hook+
   "\n\n🎬 المشهد الثاني – تقديم المنتج\n"+
   "نقدملكم "+p+".\n\n"+
   "🎬 المشهد الثالث – المميزات\n"+f+
   "\n\n🎬 المشهد الرابع – الدعوة للتفاعل\n"+t.cta;
  }else{
   script="🎬 HOOK\n"+hook+
   "\n\n🎬 PRODUCT INTRODUCTION\n"+p+
   "\n\n🎬 BENEFITS\n"+f+
   "\n\n🎬 CALL TO ACTION\n"+t.cta;
  }

  if(type==="awareness"){
   caption=hook+"\n\n"+p+"\n\n"+f+"\n\n"+t.cta;
  }

  if(type==="launch"){
   caption="🚀 "+t.intro+" "+p+" !\n\n"+
   f+"\n\n"+(price?price+"\n\n":"")+t.cta;
  }

  let hashtags=l==="ar"?
   "#منتجات #تسوق #جودة #اكتشف_منتجنا":
   l==="fr"?
   "#Produit #Shopping #Qualite #Decouverte":
   "#Product #Shopping #Quality #Discover";

  let textOutput=
   "PLATFORM: "+platform+
   "\n\n"+t.hook+"\n"+hook+
   "\n\n"+t.caption+"\n"+caption+
   "\n\n"+t.script+"\n"+script+
   "\n\n"+t.hashtags+"\n"+hashtags;

  const card=document.createElement("div");
  card.className="result-card";

  const heading=document.createElement("h3");
  heading.textContent="📱 "+platform;

  const content=document.createElement("div");
  content.className="result-text";
  content.textContent=
   "🎯 "+hook+"\n\n"+t.caption+"\n"+caption+
   "\n\n"+t.script+"\n"+script+
   "\n\n"+t.hashtags+"\n"+hashtags;

  const copy=document.createElement("button");
  copy.className="small-btn secondary";
  copy.textContent="📋 "+t.copy;
  copy.onclick=()=>copyText(content.textContent);

  card.appendChild(heading);
  card.appendChild(content);
  card.appendChild(copy);
  results.appendChild(card);

 });

 document.getElementById("copyAll").classList.remove("hidden");
}

function copyText(text){
 if(navigator.clipboard && window.isSecureContext){
  navigator.clipboard.writeText(text)
  .then(()=>alert("Copied successfully!"))
  .catch(()=>fallbackCopy(text));
 }else{
  fallbackCopy(text);
 }
}

function fallbackCopy(text){
 const area=document.createElement("textarea");
 area.value=text;
 document.body.appendChild(area);
 area.select();
 document.execCommand("copy");
 area.remove();
 alert("Copied!");
}

function copyAll(){
 const cards=document.querySelectorAll(".result-card .result-text");
 const all=[...cards].map(x=>x.textContent).join("\n\n----------------\n\n");
 copyText(all);
}

</script>
</body>
</html>
